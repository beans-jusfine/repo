name: Update APT repository metadata

on:
  push:
    branches: [main]
    paths:
      - "debs/**"
      - "scripts/build-repo.sh"
      - ".github/workflows/update-apt.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apt-metadata
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Install Debian package tools
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev gzip

      - name: Build package indexes
        run: sh scripts/build-repo.sh

      - name: Commit updated metadata
        run: |
          if git diff --quiet -- Packages Packages.gz Release; then
            echo "APT metadata is already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Packages Packages.gz Release
          git commit -m "Update APT repository metadata"
          git push origin HEAD:main
